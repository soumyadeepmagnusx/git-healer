name: 'GitHealer Self-Healing CI/CD Agent'
description: 'Autonomous multi-agent AI that diagnoses test failures, generates surgical patches, verifies in sandbox, and opens PRs.'
author: 'Soumyadeep & Antigravity AI'
branding:
  icon: 'cpu'
  color: 'green'

inputs:
  gemini_api_key:
    description: 'Google Gemini API key for LLM agents'
    required: false
    default: ''
  github_token:
    description: 'GitHub Personal Access Token or GITHUB_TOKEN for opening PRs'
    required: false
    default: ''
  test_command:
    description: 'Command used to verify tests (e.g., pytest, npm test)'
    required: false
    default: ''
  auto_pr:
    description: 'Automatically create branch and open Pull Request on verified fix'
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install GitHealer
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install rich pydantic pyyaml pytest

    - name: Run GitHealer Self-Healing Engine
      shell: bash
      env:
        GEMINI_API_KEY: ${{ inputs.gemini_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token || github.token }}
      run: |
        python -m githealer.cli run --repo . --auto-pr ${{ inputs.test_command && format('--cmd "{0}"', inputs.test_command) || '' }}
