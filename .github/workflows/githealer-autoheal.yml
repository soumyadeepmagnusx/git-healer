name: Auto-Heal CI Failures

on:
  workflow_run:
    workflows: ["Test Suite", "CI"]
    types:
      - completed

jobs:
  auto_heal:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GitHealer
        run: |
          pip install git-healer || pip install git+https://github.com/${{ github.repository_owner }}/git-healer.git

      - name: Run GitHealer Self-Healing
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git-healer run --repo . --auto-pr
